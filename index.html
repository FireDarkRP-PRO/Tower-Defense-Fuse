<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD Fuse – Tower Defense à fusion</title>
<style>
:root{--void:#080a1c;--panel:#12153a;--line:#2b3070;--gold:#ffd84a;--text:#e8ecff}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:var(--void);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px}
#top{display:flex;gap:28px;font-size:19px;font-weight:700;align-items:center}
#top b{color:var(--gold)}
#main{display:flex;gap:10px;align-items:flex-start}
canvas{width:min(100vw - 360px,(100vh - 130px)*16/9);height:auto;aspect-ratio:16/9;border:2px solid var(--line);border-radius:10px;background:#0b0d26;cursor:pointer}
#side{width:320px;display:flex;flex-direction:column;gap:8px}
#xf{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;font-size:13px;line-height:1.4}
#xf h3{margin:0 0 4px}
.xrow{display:flex;gap:10px;justify-content:center;margin-top:8px}
.xs{width:70px;height:70px;border:2px dashed var(--line);border-radius:8px;cursor:pointer;background:#0b0d26}
.xs:hover{border-color:var(--gold)}
.xs canvas{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;background:none;cursor:pointer}
#sheet{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.45;max-height:calc(100vh - 300px);overflow:auto}
#sheet h2{margin:0;font-size:22px}
table{width:100%;border-collapse:collapse;margin:8px 0}
td{padding:3px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;padding:8px 6px}
.up{color:#7dff9a}
#msg{min-height:20px;font-size:15px;color:#9fb0ff}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
button{font:inherit;font-weight:700;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:3px solid var(--gold)}
button:disabled{opacity:.45;cursor:default}
button.on{border-color:var(--gold);background:#1d2160}
#dex,#start{position:fixed;inset:0;background:rgba(8,10,28,.93);display:none;align-items:center;justify-content:center;z-index:5}
#dex.on,#start.on{display:flex}
#startbox{width:min(800px,94vw);max-height:94vh;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:20px;text-align:center}
.seg{display:flex;gap:8px;justify-content:center;margin:6px 0}
.seg button{min-width:110px}
#lvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;margin:8px 0}
.lvc{border:2px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;gap:2px;background:#0b0d26;text-align:left}
.lvc:hover{border-color:#6b75d8}.lvc.on{border-color:var(--gold);background:#1d2160}
.lvc canvas{width:100%;height:auto;aspect-ratio:16/9;border:0;border-radius:5px;cursor:pointer}
.lvc span{color:#9fb0ff}
#startbox p{color:#c4cbf5}
.opt{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:15px}
.opt input{width:18px;height:18px}
.hint{color:#9fb0ff;font-size:13px;min-height:18px}
#dexbox{width:min(1040px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:18px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.card{border:2px solid var(--line);border-radius:10px;padding:10px;background:#0b0d26;font-size:14px;line-height:1.5}
.card h3{margin:4px 0 0}
.card canvas{width:96px;height:96px;aspect-ratio:auto;border:0;background:none;cursor:default}
.chip{display:inline-block;min-width:24px;text-align:center;border:1px solid #7dff9a;border-radius:6px;margin:2px;padding:1px 5px;font-size:13px}
.chip.cur{background:#7dff9a;color:#000}
</style>
</head>
<body>
<div id="top"><span>💰 <b id="co"></b></span><span>❤ <b id="li"></b></span><span>Vague <b id="wa"></b></span><span id="lvn" style="color:#9fb0ff;font-size:15px"></span><span id="nx"></span></div>
<div id="main"><canvas id="c" width="1280" height="720"></canvas><div id="side"><aside id="sheet"></aside><div id="xf"></div></div></div>
<div id="msg"></div>
<div id="bar">
  <button id="bb">Météorite (B)</button>
  <button id="bu" style="display:none"></button>
  <button id="bw">Vague suivante (Espace)</button>
  <button id="bn" style="display:none"></button>
  <button id="bv">Vitesse ×1 (V)</button>
  <button id="bd">Pause · Index (E)</button>
</div>
<div id="dex"><div id="dexbox">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:8px;align-items:center"><b style="font-size:20px">⏸ Pause</b><button id="tr" onclick="setTab('r')">Règles</button><button id="tb" onclick="setTab('b')">Bestiaire</button><button id="tt" onclick="setTab('t')">Tours</button><button id="to" onclick="setTab('o')">Options</button></div>
    <div style="display:flex;gap:8px"><button onclick="closeDex()">Reprendre (Échap)</button></div>
  </div>
  <div id="cards"></div>
</div></div>
<div id="start" class="on"><div id="startbox">
  <h2 style="margin:0 0 6px">TD Fuse by FireDarkRP</h2>
  <p style="margin:4px 0 10px">Choisis une difficulté et un niveau, ou reprends une partie sauvegardée.</p>
  <div class="seg" id="diffBtns"></div><div id="diffDs" class="hint"></div>
  <div id="lvGrid"></div><div id="lvDs" class="hint"></div>
  <div class="row"><button id="startNew">Nouvelle partie</button><button id="startImp">Importer une sauvegarde (.txt)</button><button id="startBack" style="display:none">Retour au jeu</button></div>
  <input type="file" id="startFile" accept=".txt,.json" style="display:none">
  <div id="startMsg" class="hint"></div>
</div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=id=>document.getElementById(id);
// ---------- Réglages d'équilibrage ----------
const TUNE={hp0:22,hpGrow:1.15,dmgGrow:1.35,box0:50,boxStep:6,boxMax:400,up0:20,upGrow:1.5,rwGrow:.04};
const WIN_WAVE=30;
const cap=f=>1+2*f; // limite de niveau selon la fusion : 3, 5, 7, 9, 11… (fusion infinie)
// ---------- Difficultés ----------
const DIFF=[
 {n:'Facile',hp:.75,sp:.9,rw:1.2,coins:180,lives:30,ds:'Ennemis moins résistants et plus lents, plus de vies et de pièces au départ.'},
 {n:'Moyen',hp:1,sp:1,rw:1,coins:120,lives:20,ds:'L\u2019équilibrage de base du jeu.'},
 {n:'Difficile',hp:1.4,sp:1.12,rw:.9,coins:90,lives:12,ds:'Ennemis 40 % plus résistants et plus rapides, peu de vies, récompenses réduites.'}
];
// ---------- Niveaux (routes) ----------
// Une route est une liste de points ; elle peut se croiser, repasser sur elle-même, ou fusionner avec une autre route.
// Tous les niveaux ont 26 emplacements (générés automatiquement, sauf le niveau 1 qui garde sa grille d'origine).
const LV=[
 {n:'Zigzag',ds:'Le parcours classique : trois lignes droites reliées en Z.',
  routes:[[[-40,140],[1000,140],[1000,360],[280,360],[280,580],[1250,580]]],
  slots:(()=>{const a=[];for(let i=0;i<8;i++)a.push([380+i*80,50]);for(let i=0;i<8;i++)a.push([340+i*80,250]);for(let i=0;i<10;i++)a.push([380+i*80,470]);return a})()},
 {n:'Serpent',ds:'Un long serpent à quatre lignes : beaucoup de temps pour tirer.',
  routes:[[[-40,90],[1120,90],[1120,250],[160,250],[160,410],[1120,410],[1120,580],[250,580]]]},
 {n:'Spirale',ds:'La route s\u2019enroule autour du plateau jusqu\u2019au portail, au centre.',
  routes:[[[-40,60],[1220,60],[1220,660],[60,660],[60,210],[1070,210],[1070,510],[210,510],[210,360],[640,360]]]},
 {n:'Croisement',ds:'La route se recoupe elle-même : les ennemis passent deux fois au centre.',
  routes:[[[-40,360],[1000,360],[1000,120],[640,120],[640,620],[1200,620]]]},
 {n:'Demi-tour',ds:'La route repasse sur son premier tronçon à l\u2019envers, puis part vers le bas.',
  routes:[[[-40,360],[900,360],[900,150],[1180,150],[1180,360],[300,360],[300,600],[1000,600]]]},
 {n:'Fourche',ds:'Deux entrées (haut et bas) qui fusionnent sur une seule route vers le portail.',
  routes:[[[-40,130],[480,130],[480,360],[1000,360],[1000,560],[1200,560]],[[-40,590],[480,590],[480,360],[1000,360],[1000,560],[1200,560]]]},
 {n:'Îlot',ds:'La route se sépare en deux autour d\u2019un îlot, puis se rejoint avant le portail.',
  routes:[[[-40,360],[300,360],[300,160],[900,160],[900,360],[1200,360]],[[-40,360],[300,360],[300,560],[900,560],[900,360],[1200,360]]]},
 {n:'Labyrinthe',ds:'Cinq longs couloirs verticaux, entrée par le haut.',
  routes:[[[200,-40],[200,640],[440,640],[440,80],[680,80],[680,640],[920,640],[920,80],[1160,80],[1160,600]]]},
 {n:'Entrelacs',ds:'Un entrelacs qui se croise trois fois : les tours centrales travaillent beaucoup.',
  routes:[[[-40,240],[1000,240],[1000,480],[280,480],[280,120],[640,120],[640,600],[1200,600]]]},
 {n:'Grand détour',ds:'Le parcours le plus long : un grand tour du plateau avant une dernière boucle.',
  routes:[[[-40,360],[160,360],[160,100],[1120,100],[1120,620],[160,620],[160,440],[1000,440],[1000,220],[280,220],[280,330],[640,330]]]}
];
let RT=[],SG=[],TT=[],selLv=0,selDf=1;
function dseg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy;let t=l2?((px-a[0])*dx+(py-a[1])*dy)/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function dpath(x,y,rs){let m=1e9;for(const P of rs)for(let i=1;i<P.length;i++)m=Math.min(m,dseg(x,y,P[i-1],P[i]));return m}
function autoSlots(rs,N){
  const smp=[];
  for(const P of rs)for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],n=Math.max(1,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/25));for(let k=0;k<n;k++)smp.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n,0])}
  let out=[];
  for(const md of [74,68,62]){
    const cands=[];for(let x=40;x<=1240;x+=40)for(let y=40;y<=680;y+=40)if(dpath(x,y,rs)>=md)cands.push([x,y]);
    smp.forEach(p=>p[2]=0);out=[];
    while(out.length<N){
      let best=null,bs=-1;
      for(const c of cands){
        if(out.some(o=>Math.abs(o[0]-c[0])<72&&Math.abs(o[1]-c[1])<72))continue;
        let sc=0;for(const p of smp)if(Math.hypot(p[0]-c[0],p[1]-c[1])<=175)sc+=1/(1+p[2]);
        if(sc>bs){bs=sc;best=c}
      }
      if(!best)break;
      out.push(best);for(const p of smp)if(Math.hypot(p[0]-best[0],p[1]-best[1])<=175)p[2]++;
    }
    if(out.length>=N)break;
  }
  return out.sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
}
const S=[];
function setLevel(li){
  const L=LV[li];RT=L.routes;SG=[];TT=[];
  for(const P of RT){const sg=[];let t=0;for(let i=1;i<P.length;i++){const l=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);sg.push(l);t+=l}SG.push(sg);TT.push(t)}
  S.length=0;
  if(!L.slots)L.slots=autoSlots(RT,26);
  L.slots.forEach(p=>S.push({x:p[0],y:p[1],t:null}));
}
function at(d,r){
  const P=RT[r],sg=SG[r];
  for(let i=0;i<sg.length;i++){if(d<=sg[i]){const t=d/sg[i];return[P[i][0]+(P[i+1][0]-P[i][0])*t,P[i][1]+(P[i+1][1]-P[i][1])*t]}d-=sg[i]}
  return P[P.length-1];
}
const stars=Array.from({length:120},()=>({x:Math.random()*1280,y:Math.random()*720,r:Math.random()*1.6+.3,a:Math.random()*.6+.2}));
// ---------- Tours (10) ----------
const RN=['Commun','Peu commun','Rare','Épique','Légendaire','Mythique'],RC=['#b8c0e0','#7dff9a','#5ec8ff','#c07bff','#ffb020','#ff3df2'];
const T=[
 {n:'Éclat',c:'#ffd84a',rar:0,w:10,d:10,r:190,cd:.45,sd:3},
 {n:'Braise',c:'#ff7a45',rar:0,w:10,d:9,r:170,cd:.7,sd:4},
 {n:'Givre',c:'#5ee7ff',rar:0,w:8,d:7,r:180,cd:.7,sd:5},
 {n:'Nova',c:'#ff5fa2',rar:1,w:6,d:14,r:170,cd:1.1,sd:6},
 {n:'Ronce',c:'#7bd957',rar:1,w:6,d:9,r:200,cd:.6,sd:7},
 {n:'Pulsar',c:'#c07bff',rar:2,w:3,d:50,r:260,cd:1.9,sd:8},
 {n:'Éclair',c:'#9bb8ff',rar:2,w:3,d:16,r:190,cd:1,st:5},
 {n:'Traqueur',c:'#ff4d4d',rar:2,w:3,d:20,r:280,cd:1.3,st:4},
 {n:'Prisme',c:'#ffffff',rar:3,w:1.5,d:18,r:230,cd:1.2,st:6},
 {n:'Singularité',c:'#7a3cff',rar:4,w:.6,d:40,r:240,cd:2.4,sd:24},
 {n:'Néant',c:'#ff3df2',rar:5,w:0,d:0,r:0,cd:1,st:8}
];
// Tour mythique : ne tire pas, offre un bouton « Nuke » (dégâts en % des PV max)
const MY=10,MYTH_CHANCE=.001,MYTH_CD=3,MYTH_UP=6; // MYTH_UP : multiplicateur du prix d'amélioration (légendaire : ×2,2)
const capOf=t=>cap(t.fu); // le Néant suit la règle de fusion normale : niveau max 9 (fusion 4 minimum)
const nukePct=l=>Math.min(1,.1+.1*l); // niv 1 : 20 %  →  niv 9 (max) : 100 %
const dm=(j,l)=>Math.round(T[j].d*Math.pow(TUNE.dmgGrow,l-1));
const rg=(j,l)=>Math.round(T[j].r*(1+.03*(l-1)));
const cdv=(j,l)=>T[j].cd*Math.pow(.97,l-1);
const f1=x=>+x.toFixed(1);
function stat(j,l){if(j===MY){const p=nukePct(l);return{dmg:0,range:0,sh:0,dps:0,nk:Math.round(p*100),nb:Math.round(p*50),cdw:MYTH_CD}}
  const c=cdv(j,l),d=dm(j,l);return{dmg:d,range:rg(j,l),sh:+(1/c).toFixed(2),dps:Math.round(d/c)}}
function pw(j,l){return[
 ['Surcharge','Un tir sur 5 inflige ×'+f1(2+.1*(l-1))+' dégâts.','Toutes les '+f1(5*cdv(0,l))+' s'],
 ['Brûlure','Enflamme la cible : '+Math.round(dm(1,l)*.4)+' dégâts/s.','Durée : '+f1(3+.3*(l-1))+' s'],
 ['Gel','Ralentit de 50 % les Vides touchés.','Durée : '+f1(1.6+.2*(l-1))+' s'],
 ['Explosion','Dégâts de zone autour de la cible.','Rayon : '+Math.round(60*(1+.08*(l-1)))+' px'],
 ['Entrave','Une touche sur 3 immobilise la cible.','Durée : '+f1(.5+.05*(l-1))+' s'],
 ['Exécution','+'+(50+5*(l-1))+' % de dégâts sous 30 % de vie.','Seuil : 30 % de vie'],
 ['Chaîne','L\u2019éclair rebondit '+(2+Math.floor(l/3))+' fois à 60 % des dégâts.','Rayon de rebond : 100 px'],
 ['Marque','La cible subit +'+(25+2*(l-1))+' % de dégâts.','Durée : 3 s'],
 ['Multi-tir','Tire sur plusieurs cibles à la fois.','Cibles : '+(2+(l>>2))],
 ['Trou noir','Zone de 80 px et recul de '+(50+5*(l-1))+' px.','Instantané'],
 ['Nuke','Ne tire pas. Le bouton Nuke (N) retire '+Math.round(nukePct(l)*100)+' % des PV max de tous les ennemis ('+Math.round(nukePct(l)*50)+' % pour les boss).','Utilisable 1 fois toutes les '+MYTH_CD+' vagues']
][j]}
// ---------- Ennemis (15) ----------
const K=[
 {n:'Ombre',sp:60,hp:1,r:13,rw:4,c:'#5b3fd0',sh:'ghost',from:1,w:10,ds:'Le Vide de base : lent et nombreux.'},
 {n:'Filant',sp:115,hp:.55,r:10,rw:3,c:'#e0468f',sh:'shard',from:2,w:6,ds:'Fragile mais très rapide.'},
 {n:'Rampant',sp:45,hp:1.7,r:14,rw:5,c:'#4caf50',sh:'orb',from:3,w:6,ds:'Une masse visqueuse plus résistante.'},
 {n:'Essaim',sp:90,hp:.3,r:8,rw:2,c:'#ffb74d',sh:'orb',from:3,w:5,grp:4,ds:'Arrive par groupes de quatre.'},
 {n:'Colosse',sp:38,hp:3.2,r:19,rw:9,c:'#2f8f78',sh:'block',from:4,w:4,ds:'Lent, massif, très résistant.'},
 {n:'Cristal',sp:50,hp:2,r:15,rw:8,c:'#4fc3f7',sh:'shard',from:5,w:4,ar:.35,ds:'Sa carapace absorbe 35 % des dégâts.'},
 {n:'Spore',sp:55,hp:1.4,r:15,rw:7,c:'#c0ca33',sh:'orb',from:6,w:4,sp2:[0,2],ds:'Éclate en deux Ombres à sa mort.'},
 {n:'Spectre',sp:70,hp:1.3,r:13,rw:8,c:'#cfd8ff',sh:'ghost',from:7,w:3,ims:1,ds:'Insensible au gel et à l\u2019entrave.'},
 {n:'Ronceux',sp:48,hp:2.4,r:16,rw:10,c:'#2e7d32',sh:'spike',from:8,w:3,rg:.04,ds:'Régénère 4 % de sa vie par seconde.'},
 {n:'Comète',sp:100,hp:1.8,r:14,rw:12,c:'#ff7043',sh:'shard',from:9,w:2,ds:'Rapide et costaud.'},
 {n:'Golem',sp:30,hp:5,r:22,rw:16,c:'#78909c',sh:'block',from:10,w:2,ar:.5,ds:'Armure de pierre : 50 % de dégâts en moins.'},
 {n:'Mère',sp:42,hp:3.5,r:20,rw:18,c:'#ec407a',sh:'orb',from:12,w:1.5,sp2:[1,3],ds:'Libère trois Filants en mourant.'},
 {n:'Dévoreur',sp:30,hp:28,r:28,rw:70,c:'#d32f2f',sh:'ghost',from:5,w:0,boss:1,life:5,ds:'Boss. Coûte 5 vies s\u2019il passe.'},
 {n:'Titan',sp:26,hp:40,r:30,rw:100,c:'#5c6bc0',sh:'block',from:10,w:0,boss:1,life:8,ar:.4,ims:1,ds:'Boss blindé, insensible au gel.'},
 {n:'Hydre',sp:28,hp:60,r:32,rw:150,c:'#00897b',sh:'spike',from:15,w:0,boss:1,life:10,rg:.02,sp2:[4,3],ds:'Boss qui régénère et libère trois Colosses.'}
];
const hpAt=(k,w)=>TUNE.hp0*Math.pow(TUNE.hpGrow,w-1)*K[k].hp*DIFF[g.diff].hp;
const rwAt=(k,w)=>Math.round(K[k].rw*(1+TUNE.rwGrow*(w-1))*DIFF[g.diff].rw);
// ---------- Index (sauvegardé dans le navigateur) ----------
let DX=null;try{DX=JSON.parse(localStorage.getItem('cst-dex'))}catch(e){}
function fixDx(d){if(!d||!Array.isArray(d.k)||d.k.length!==K.length||!Array.isArray(d.t))return null;return{k:d.k,t:T.map((_,i)=>Math.max(0,d.t[i]|0))}}
DX=fixDx(DX)||{k:K.map(()=>0),t:T.map(()=>0)};
let SET={autoWave:true,lv:0,diff:1};try{Object.assign(SET,JSON.parse(localStorage.getItem('cst-set'))||{})}catch(e){}
let PROG={best:0,bl:{}};try{Object.assign(PROG,JSON.parse(localStorage.getItem('cst-prog'))||{})}catch(e){}
if(!PROG.bl||typeof PROG.bl!=='object')PROG.bl={};
function save(){try{localStorage.setItem('cst-dex',JSON.stringify(DX));localStorage.setItem('cst-set',JSON.stringify(SET));localStorage.setItem('cst-prog',JSON.stringify(PROG))}catch(e){}}
addEventListener('beforeunload',save);
function unlock(t){if(t.lvl>DX.t[t.type]){DX.t[t.type]=t.lvl;save()}}
function exportSave(){
  const data={v:4,tier:g.tier,xf:g.xf.map(towerData),lv:g.lv,diff:g.diff,nkl:nukeLeft(),coins:g.coins,lives:g.lives,wave:g.wave,boxes:g.boxes,autoWave:g.autoWave,
    slots:S.map(s=>s.t&&s.t.h<=0?{type:s.t.type,fu:s.t.fu,lvl:s.t.lvl,inv:s.t.inv}:null),dex:DX};
  const blob=new Blob([JSON.stringify(data)],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TD-Fuse-sauvegarde.txt';

  }else{

    h=seen.length?'':'<p>Aucune tour obtenue pour l\u2019instant. Elles apparaissent ici dès que tu en obtiens une.</p>';
    for(const j of seen){
      const d=T[j],mx=DX.t[j],l=Math.min(vl[j]||1,mx),a=stat(j,l),p=pw(j,l);vl[j]=l;
      let chips='';for(let i=1;i<=mx;i++)chips+='<span class="chip'+(i===l?' cur':'')+'">'+i+'</span>';
      h+='<div class="card"><canvas id="tc'+j+'" width="96" height="96"></canvas><h3 style="color:'+d.c+'">'+d.n+'</h3><div style="color:'+RC[d.rar]+'">'+RN[d.rar]+'</div>'+
       '<div>Niveaux débloqués : '+chips+'</div>'+
       '<div class="row"><button onclick="lvStep('+j+',-1)"'+(l<=1?' disabled':'')+'>◀</button><button onclick="lvStep('+j+',1)"'+(l>=mx?' disabled':'')+'>Niveau '+Math.min(l+1,mx)+' ▶</button></div>'+
       '<table><tr><td>Niveau affiché</td><td>'+l+'</td></tr>'+
       '<tr><td>Fusion minimale</td><td>'+Math.max(1,Math.ceil((l-1)/2))+'</td></tr>'+(j===MY?'<tr><td>PV max retirés (ennemis)</td><td>'+a.nk+' %</td></tr><tr><td>PV max retirés (boss)</td><td>'+a.nb+' %</td></tr><tr><td>Recharge</td><td>'+a.cdw+' vagues</td></tr>':'')+
       (j===MY?'':'<tr><td>Dégâts</td><td>'+a.dmg+'</td></tr><tr><td>Rayon d\u2019action</td><td>'+a.range+' px</td></tr>')+
       (j===MY?'':'<tr><td>Cadence</td><td>'+a.sh+' tirs/s</td></tr><tr><td>Dégâts / seconde</td><td>'+a.dps+'</td></tr>')+'</table>'+
       '<b>'+p[0]+'</b> : '+p[1]+'<br><i>'+p[2]+'</i></div>';
      draws.push(c=>{c.scale(1.5,1.5);drawTower(c,32,30,{type:j,fu:Math.max(1,Math.ceil((l-1)/2)),lvl:l,h:0})});
    }
  }
  $('cards').innerHTML=h;
  const ids=tab==='b'?K.map((d,i)=>i).filter(i=>DX.k[i]>0):T.map((d,i)=>i).filter(j=>DX.t[j]>0);
  ids.forEach((id,n)=>{const c=$((tab==='b'?'dc':'tc')+id).getContext('2d');draws[n](c)});
}
// ---------- Sauvegarde automatique de la partie en cours (survit au rafraîchissement) ----------
const GAME_KEY='cst-game';
function snapshot(){
  return{v:1,lv:g.lv,diff:g.diff,coins:g.coins,lives:g.lives,wave:g.wave,boxes:g.boxes,tier:g.tier,autoWave:g.autoWave,
    nk:g.nk,cont:g.cont,won:g.won,timer:g.timer,cd:g.cd,rc:g.rc,q:g.q,en:g.en.filter(e=>e.hp>0&&!e.dead&&!e.esc),
    slots:S.map(s=>towerData(s.t)),xf:g.xf.map(towerData)};
}
function autosave(){
  try{
    if($('start').classList.contains('on'))return;
    if(g.over){localStorage.removeItem(GAME_KEY);return}
    localStorage.setItem(GAME_KEY,JSON.stringify(snapshot()));
  }catch(e){}
}
function restoreGame(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.slots))return false;
  SET.lv=LV[d.lv]?d.lv|0:0;SET.diff=DIFF[d.diff]?d.diff|0:1;
  reset();selLv=SET.lv;selDf=SET.diff;
  g.coins=+d.coins||0;g.lives=d.lives>0?+d.lives:DIFF[g.diff].lives;g.wave=Math.max(0,d.wave|0);g.boxes=Math.max(0,d.boxes|0);
  g.tier=Math.max(1,d.tier|0);g.xf=[0,1,2].map(i=>mkT(d.xf&&d.xf[i]));
  g.autoWave=d.autoWave!==false;SET.autoWave=g.autoWave;
  g.nk=Number.isFinite(d.nk)?d.nk:-99;g.cont=!!d.cont;g.won=!!d.won;
  g.timer=Number.isFinite(d.timer)?d.timer:12;g.cd=+d.cd||0;g.rc=d.rc|0;
  g.q=(Array.isArray(d.q)?d.q:[]).filter(k=>K[k]);
  g.en=(Array.isArray(d.en)?d.en:[]).filter(e=>e&&K[e.k]&&RT[e.rt]&&e.hp>0&&e.mx>0);
  S.forEach((s,i)=>{s.t=mkT(d.slots[i])});
  g.paused=g.won;
  return true;
}
addEventListener('beforeunload',autosave);addEventListener('pagehide',autosave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave()});
setInterval(autosave,1500);
selLv=LV[SET.lv]?SET.lv:0;selDf=DIFF[SET.diff]?SET.diff:1;
reset();g.paused=true;renderStart();
{let sv=null;try{sv=JSON.parse(localStorage.getItem(GAME_KEY))}catch(e){}
 let ok=false;try{ok=restoreGame(sv)}catch(e){ok=false}
 if(ok){closeStart();g.paused=g.won;say('Partie reprise là où tu l\u2019avais laissée.')}else if(sv){reset();g.paused=true;renderStart()}}
requestAnimationFrame(loop);
</script>
