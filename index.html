<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD Fuse – Tower Defense à fusion</title>
<style>
:root{--void:#080a1c;--panel:#12153a;--line:#2b3070;--gold:#ffd84a;--text:#e8ecff}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:var(--void);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px}
#top{display:flex;gap:28px;font-size:19px;font-weight:700;align-items:center}
#top b{color:var(--gold)}
#main{display:flex;gap:10px;align-items:flex-start}
canvas{width:min(100vw - 360px,(100vh - 130px)*16/9);height:auto;aspect-ratio:16/9;border:2px solid var(--line);border-radius:10px;background:#0b0d26;cursor:pointer}
#sheet{width:320px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.45;max-height:calc(100vh - 130px);overflow:auto}
#sheet h2{margin:0;font-size:22px}
table{width:100%;border-collapse:collapse;margin:8px 0}
td{padding:3px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;padding:8px 6px}
.up{color:#7dff9a}
#msg{min-height:20px;font-size:15px;color:#9fb0ff}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
button{font:inherit;font-weight:700;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:3px solid var(--gold)}
button:disabled{opacity:.45;cursor:default}
button.on{border-color:var(--gold);background:#1d2160}
#dex,#start{position:fixed;inset:0;background:rgba(8,10,28,.93);display:none;align-items:center;justify-content:center;z-index:5}
#dex.on,#start.on{display:flex}
#startbox{width:min(440px,92vw);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:22px;text-align:center}
#startbox p{color:#c4cbf5}
.opt{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:15px}
.opt input{width:18px;height:18px}
.hint{color:#9fb0ff;font-size:13px;min-height:18px}
#dexbox{width:min(1040px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:18px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.card{border:2px solid var(--line);border-radius:10px;padding:10px;background:#0b0d26;font-size:14px;line-height:1.5}
.card h3{margin:4px 0 0}
.card canvas{width:96px;height:96px;aspect-ratio:auto;border:0;background:none;cursor:default}
.chip{display:inline-block;min-width:24px;text-align:center;border:1px solid #7dff9a;border-radius:6px;margin:2px;padding:1px 5px;font-size:13px}
.chip.cur{background:#7dff9a;color:#000}
</style>
</head>
<body>
<div id="top"><span>💰 <b id="co"></b></span><span>❤ <b id="li"></b></span><span>Vague <b id="wa"></b></span><span id="nx"></span></div>
<div id="main"><canvas id="c" width="1280" height="720"></canvas><aside id="sheet"></aside></div>
<div id="msg"></div>
<div id="bar">
  <button id="bb">Météorite (B)</button>
  <button id="bw">Vague suivante (Espace)</button>
  <button id="bv">Vitesse ×1 (V)</button>
  <button id="bd">Pause · Index (E)</button>
</div>
<div id="dex"><div id="dexbox">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:8px;align-items:center"><b style="font-size:20px">⏸ Pause</b><button id="tr" onclick="setTab('r')">Règles</button><button id="tb" onclick="setTab('b')">Bestiaire</button><button id="tt" onclick="setTab('t')">Tours</button><button id="to" onclick="setTab('o')">Options</button></div>
    <div style="display:flex;gap:8px"><button onclick="closeDex()">Reprendre (Échap)</button></div>
  </div>
  <div id="cards"></div>
</div></div>
<div id="start" class="on"><div id="startbox">
  <h2 style="margin:0 0 6px">TD Fuse by FireDarkRP</h2>
  <p>Reprends une partie sauvegardée ou commence une nouvelle partie.</p>
  <div class="row"><button id="startNew">Nouvelle partie</button><button id="startImp">Importer une sauvegarde (.txt)</button></div>
  <input type="file" id="startFile" accept=".txt,.json" style="display:none">
  <div id="startMsg" class="hint"></div>
</div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=id=>document.getElementById(id);
// ---------- Réglages d'équilibrage ----------
const TUNE={hp0:22,hpGrow:1.15,dmgGrow:1.35,box0:50,boxStep:6,boxMax:400,up0:20,upGrow:1.5,fuMax:4,rwGrow:.04};
const WIN_WAVE=30;
const cap=f=>1+2*f; // limite de niveau selon la fusion : 3, 5, 7, 9
// ---------- Carte ----------
const P=[[-40,140],[1000,140],[1000,360],[280,360],[280,580],[1320,580]];
const segs=[];let tot=0;
for(let i=1;i<P.length;i++){const l=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);segs.push(l);tot+=l}
function at(d){for(let i=0;i<segs.length;i++){if(d<=segs[i]){const t=d/segs[i];return[P[i][0]+(P[i+1][0]-P[i][0])*t,P[i][1]+(P[i+1][1]-P[i][1])*t]}d-=segs[i]}return P[P.length-1]}
const S=[];
for(let i=0;i<8;i++)S.push({x:380+i*80,y:50,t:null});
for(let i=0;i<8;i++)S.push({x:340+i*80,y:250,t:null});
for(let i=0;i<10;i++)S.push({x:380+i*80,y:470,t:null});
const stars=Array.from({length:120},()=>({x:Math.random()*1280,y:Math.random()*720,r:Math.random()*1.6+.3,a:Math.random()*.6+.2}));
// ---------- Tours (10) ----------
const RN=['Commun','Peu commun','Rare','Épique','Légendaire'],RC=['#b8c0e0','#7dff9a','#5ec8ff','#c07bff','#ffb020'];
const T=[
 {n:'Éclat',c:'#ffd84a',rar:0,w:10,d:10,r:190,cd:.45,sd:3},
 {n:'Braise',c:'#ff7a45',rar:0,w:10,d:9,r:170,cd:.7,sd:4},
 {n:'Givre',c:'#5ee7ff',rar:0,w:8,d:7,r:180,cd:.7,sd:5},
 {n:'Nova',c:'#ff5fa2',rar:1,w:6,d:14,r:170,cd:1.1,sd:6},
 {n:'Ronce',c:'#7bd957',rar:1,w:6,d:9,r:200,cd:.6,sd:7},
 {n:'Pulsar',c:'#c07bff',rar:2,w:3,d:50,r:260,cd:1.9,sd:8},
 {n:'Éclair',c:'#9bb8ff',rar:2,w:3,d:16,r:190,cd:1,st:5},
 {n:'Traqueur',c:'#ff4d4d',rar:2,w:3,d:20,r:280,cd:1.3,st:4},
 {n:'Prisme',c:'#ffffff',rar:3,w:1.5,d:18,r:230,cd:1.2,st:6},
 {n:'Singularité',c:'#7a3cff',rar:4,w:.6,d:40,r:240,cd:2.4,sd:24}
];
const dm=(j,l)=>Math.round(T[j].d*Math.pow(TUNE.dmgGrow,l-1));
const rg=(j,l)=>Math.round(T[j].r*(1+.03*(l-1)));
const cdv=(j,l)=>T[j].cd*Math.pow(.97,l-1);
const f1=x=>+x.toFixed(1);
function stat(j,l){const c=cdv(j,l),d=dm(j,l);return{dmg:d,range:rg(j,l),sh:+(1/c).toFixed(2),dps:Math.round(d/c)}}
function pw(j,l){return[
 ['Surcharge','Un tir sur 5 inflige ×'+f1(2+.1*(l-1))+' dégâts.','Toutes les '+f1(5*cdv(0,l))+' s'],
 ['Brûlure','Enflamme la cible : '+Math.round(dm(1,l)*.4)+' dégâts/s.','Durée : '+f1(3+.3*(l-1))+' s'],
 ['Gel','Ralentit de 50 % les Vides touchés.','Durée : '+f1(1.6+.2*(l-1))+' s'],
 ['Explosion','Dégâts de zone autour de la cible.','Rayon : '+Math.round(60*(1+.08*(l-1)))+' px'],
 ['Entrave','Une touche sur 3 immobilise la cible.','Durée : '+f1(.5+.05*(l-1))+' s'],
 ['Exécution','+'+(50+5*(l-1))+' % de dégâts sous 30 % de vie.','Seuil : 30 % de vie'],
 ['Chaîne','L\u2019éclair rebondit '+(2+Math.floor(l/3))+' fois à 60 % des dégâts.','Rayon de rebond : 100 px'],
 ['Marque','La cible subit +'+(25+2*(l-1))+' % de dégâts.','Durée : 3 s'],
 ['Multi-tir','Tire sur plusieurs cibles à la fois.','Cibles : '+(2+(l>>2))],
 ['Trou noir','Zone de 80 px et recul de '+(50+5*(l-1))+' px.','Instantané']
][j]}
// ---------- Ennemis (15) ----------
const K=[
 {n:'Ombre',sp:60,hp:1,r:13,rw:4,c:'#5b3fd0',sh:'ghost',from:1,w:10,ds:'Le Vide de base : lent et nombreux.'},
 {n:'Filant',sp:115,hp:.55,r:10,rw:3,c:'#e0468f',sh:'shard',from:2,w:6,ds:'Fragile mais très rapide.'},
 {n:'Rampant',sp:45,hp:1.7,r:14,rw:5,c:'#4caf50',sh:'orb',from:3,w:6,ds:'Une masse visqueuse plus résistante.'},
 {n:'Essaim',sp:90,hp:.3,r:8,rw:2,c:'#ffb74d',sh:'orb',from:3,w:5,grp:4,ds:'Arrive par groupes de quatre.'},
 {n:'Colosse',sp:38,hp:3.2,r:19,rw:9,c:'#2f8f78',sh:'block',from:4,w:4,ds:'Lent, massif, très résistant.'},
 {n:'Cristal',sp:50,hp:2,r:15,rw:8,c:'#4fc3f7',sh:'shard',from:5,w:4,ar:.35,ds:'Sa carapace absorbe 35 % des dégâts.'},
 {n:'Spore',sp:55,hp:1.4,r:15,rw:7,c:'#c0ca33',sh:'orb',from:6,w:4,sp2:[0,2],ds:'Éclate en deux Ombres à sa mort.'},
 {n:'Spectre',sp:70,hp:1.3,r:13,rw:8,c:'#cfd8ff',sh:'ghost',from:7,w:3,ims:1,ds:'Insensible au gel et à l\u2019entrave.'},
 {n:'Ronceux',sp:48,hp:2.4,r:16,rw:10,c:'#2e7d32',sh:'spike',from:8,w:3,rg:.04,ds:'Régénère 4 % de sa vie par seconde.'},
 {n:'Comète',sp:100,hp:1.8,r:14,rw:12,c:'#ff7043',sh:'shard',from:9,w:2,ds:'Rapide et costaud.'},
 {n:'Golem',sp:30,hp:5,r:22,rw:16,c:'#78909c',sh:'block',from:10,w:2,ar:.5,ds:'Armure de pierre : 50 % de dégâts en moins.'},
 {n:'Mère',sp:42,hp:3.5,r:20,rw:18,c:'#ec407a',sh:'orb',from:12,w:1.5,sp2:[1,3],ds:'Libère trois Filants en mourant.'},
 {n:'Dévoreur',sp:30,hp:28,r:28,rw:70,c:'#d32f2f',sh:'ghost',from:5,w:0,boss:1,life:5,ds:'Boss. Coûte 5 vies s\u2019il passe.'},
 {n:'Titan',sp:26,hp:40,r:30,rw:100,c:'#5c6bc0',sh:'block',from:10,w:0,boss:1,life:8,ar:.4,ims:1,ds:'Boss blindé, insensible au gel.'},
 {n:'Hydre',sp:28,hp:60,r:32,rw:150,c:'#00897b',sh:'spike',from:15,w:0,boss:1,life:10,rg:.02,sp2:[4,3],ds:'Boss qui régénère et libère trois Colosses.'}
];
const hpAt=(k,w)=>TUNE.hp0*Math.pow(TUNE.hpGrow,w-1)*K[k].hp;
// ---------- Index (sauvegardé dans le navigateur) ----------
let DX=null;try{DX=JSON.parse(localStorage.getItem('cst-dex'))}catch(e){}
if(!DX||!DX.k||DX.k.length!==K.length||DX.t.length!==T.length)DX={k:K.map(()=>0),t:T.map(()=>0)};
let SET={autoWave:true};try{Object.assign(SET,JSON.parse(localStorage.getItem('cst-set'))||{})}catch(e){}
let PROG={best:0};try{Object.assign(PROG,JSON.parse(localStorage.getItem('cst-prog'))||{})}catch(e){}
function save(){try{localStorage.setItem('cst-dex',JSON.stringify(DX));localStorage.setItem('cst-set',JSON.stringify(SET));localStorage.setItem('cst-prog',JSON.stringify(PROG))}catch(e){}}
addEventListener('beforeunload',save);
function unlock(t){if(t.lvl>DX.t[t.type]){DX.t[t.type]=t.lvl;save()}}
function exportSave(){
  const data={v:2,coins:g.coins,lives:g.lives,wave:g.wave,boxes:g.boxes,autoWave:g.autoWave,
    slots:S.map(s=>s.t&&s.t.h<=0?{type:s.t.type,fu:s.t.fu,lvl:s.t.lvl,inv:s.t.inv}:null),dex:DX};
  const blob=new Blob([JSON.stringify(data)],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TD-Fuse-sauvegarde.txt';
  document.body.appendChild(a);a.click();a.remove();
}
let lastImportNote='';
function applySave(data){
  if(!data||typeof data!=='object'||!Array.isArray(data.slots))return false;
  g.coins=+data.coins||0;g.lives=data.lives>0?data.lives:20;g.boxes=+data.boxes||0;
  g.autoWave=data.autoWave!==false;SET.autoWave=g.autoWave;
  // L'import doit respecter la vague du fichier, indépendamment de la progression
  // enregistrée localement dans ce navigateur.
  const w=Math.max(0,Number(data.wave-1)||0);lastImportNote='';
  g.wave=w;PROG.best=Math.max(PROG.best,w);
  g.en=[];g.bl=[];g.fx=[];g.q=[];g.cd=0;g.timer=15;g.sel=null;g.over=false;
  S.forEach((s,i)=>{const d=data.slots[i];s.t=(d&&T[d.type])?{type:d.type,fu:Math.max(1,d.fu|0),lvl:Math.max(1,d.lvl|0),h:0,h0:0,cool:0,inv:+d.inv||0,n:0}:null});
  if(data.dex&&Array.isArray(data.dex.k)&&data.dex.k.length===K.length&&Array.isArray(data.dex.t)&&data.dex.t.length===T.length)DX=data.dex;
  save();return true;
}
function importFile(file,cb){
  const r=new FileReader();
  r.onload=()=>{let ok=false;try{ok=applySave(JSON.parse(r.result))}catch(e){ok=false}cb(ok)};
  r.onerror=()=>cb(false);
  r.readAsText(file);
}
// ---------- État ----------
const boxPrice=()=>Math.min(TUNE.boxMax,TUNE.box0+TUNE.boxStep*g.boxes);
const upc=t=>Math.round(TUNE.up0*Math.pow(TUNE.upGrow,t.lvl-1)*(1+.3*T[t.type].rar));
let g,drag=null,mouse={x:0,y:0},tab='b';const vl={};
function say(m){$('msg').textContent=m}
function reset(){
  g={coins:120,lives:20,wave:0,en:[],bl:[],fx:[],q:[],sel:null,boxes:0,over:false,won:false,timer:15,speed:1,cd:0,paused:false,autoWave:SET.autoWave};
  S.forEach(s=>s.t=null);
  say('Achète une météorite pour obtenir ta première tour.');
}
function buyBox(){
  if(g.over)return;
  const free=S.filter(s=>!s.t);
  if(!free.length)return say('Plus de place : fusionne des tours identiques pour libérer des emplacements.');
  const p=boxPrice();
  if(g.coins<p)return say('Pas assez de pièces pour une météorite ('+p+').');
  g.coins-=p;g.boxes++;
  let r=Math.random()*T.reduce((a,d)=>a+d.w,0),ty=0;
  for(let i=0;i<T.length;i++){r-=T[i].w;if(r<=0){ty=i;break}}
  const s=free[Math.floor(Math.random()*free.length)];
  s.t={type:ty,fu:1,lvl:1,h:1.6,h0:1.6,cool:0,inv:p,n:0};
  g.sel=s;say('La météorite s\u2019ouvre…');
}
function upgrade(){
  const s=g.sel,t=s&&s.t;if(!t||t.h>0||g.over)return;
  if(t.lvl>=cap(t.fu))return say('Niveau max : fusionne avec une '+T[t.type].n+' de fusion '+t.fu+' pour monter la limite.');
  const p=upc(t);
  if(g.coins<p)return say('Il faut '+p+' pièces pour améliorer.');
  g.coins-=p;t.inv+=p;t.lvl++;unlock(t);
  g.fx.push({x:s.x,y:s.y,r:10,mx:50,c:'#fff',l:.35,m:.35});
}
function sell(){const s=g.sel;if(!s||!s.t||g.over)return;g.coins+=Math.floor(s.t.inv*.5);s.t=null;g.sel=null}
function fuse(a,b){
  const x=a.t,y=b.t;
  if(x.h>0||y.h>0)return say('Attends que la météorite soit ouverte.');
  if(x.type!==y.type||x.fu!==y.fu)return say('Fusion impossible : il faut deux tours identiques (même type et même fusion).');
  if(x.fu>=TUNE.fuMax)return say('Cette tour est déjà à la fusion maximale.');
  b.t={type:x.type,fu:x.fu+1,lvl:Math.max(x.lvl,y.lvl)+1,h:0,h0:0,cool:0,inv:x.inv+y.inv,n:0};
  a.t=null;g.sel=b;unlock(b.t);
  g.fx.push({x:b.x,y:b.y,r:10,mx:90,c:T[x.type].c,l:.5,m:.5});
  say(T[x.type].n+' : fusion '+b.t.fu+', niveau '+b.t.lvl+' (limite '+cap(b.t.fu)+').');
}
function startWave(){
  g.wave++;PROG.best=Math.max(PROG.best,g.wave);save();g.timer=12;
  const w=g.wave,n=5+w*2,ids=K.map((d,i)=>i),el=ids.filter(i=>!K[i].boss&&K[i].from<=w),tw=el.reduce((a,i)=>a+K[i].w,0);
  for(let i=0;i<n;i++){
    let r=Math.random()*tw,k=el[0];
    for(const e of el){r-=K[e].w;if(r<=0){k=e;break}}
    for(let m=0;m<(K[k].grp||1);m++)g.q.push(k);
  }
  if(w%5===0){const bs=ids.filter(i=>K[i].boss&&K[i].from<=w);g.q.push(bs[(w/5-1)%bs.length]);say('Un boss approche.')}
  else say('Vague '+w+' en approche.');
  g.cd=0;
}
function spawn(k,d0){
  const d=K[k],hp=hpAt(k,g.wave),[x,y]=at(d0);
  g.en.push({k,d:d0,x,y,hp,mx:hp,sp:d.sp,r:d.r,slowT:0,stT:0,bn:0,bt:0,mk:0,mkT:0,hits:0,hurtT:0,kb:0});
}
// ---------- Combat ----------
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hurt(e,dmg,b){
  const d=K[e.k],j=b.ty,l=b.lv;
  if(e.mkT>0)dmg*=1+e.mk;
  dmg*=1-(d.ar||0);
  if(j===5&&e.hp<e.mx*.3)dmg*=1.5+.05*(l-1);
  e.hp-=dmg;e.hurtT=1.2;
  if(!d.ims){
    if(j===2)e.slowT=1.6+.2*(l-1);
    if(j===4&&++e.hits%3===0)e.stT=.5+.05*(l-1);
  }
  if(j===1){e.bn=b.dm*.4;e.bt=3+.3*(l-1)}
  if(j===7){e.mk=.25+.02*(l-1);e.mkT=3}
  if(j===9){const room=Math.max(0,240-(e.kb||0)),use=Math.min(50+5*(l-1),room);e.d=Math.max(0,e.d-use);e.kb=(e.kb||0)+use}
}
function hit(b){
  const j=b.ty,l=b.lv,e0=b.tg;let list=[e0];
  if(j===3)list=g.en.filter(e=>dist(e,e0)<=60*(1+.08*(l-1)));
  if(j===9)list=g.en.filter(e=>dist(e,e0)<=80);
  for(const e of list)hurt(e,b.dm,b);
  if(j===6){
    let cur=e0;const seen=[e0];
    for(let i=0,n=2+Math.floor(l/3);i<n;i++){
      const nx=g.en.filter(e=>!seen.includes(e)&&e.hp>0&&dist(e,cur)<=100).sort((a,c)=>dist(a,cur)-dist(c,cur))[0];
      if(!nx)break;
      seen.push(nx);hurt(nx,b.dm*.6,b);
      g.fx.push({x:cur.x,y:cur.y,x2:nx.x,y2:nx.y,c:T[6].c,l:.2,m:.2});cur=nx;
    }
  }
  g.fx.push({x:e0.x,y:e0.y,r:4,mx:j===3?60:j===9?80:b.crit?30:18,c:T[j].c,l:.25,m:.25});
}
function update(dt){
  if(g.q.length){g.cd-=dt;if(g.cd<=0){g.cd=.7;spawn(g.q.shift(),0)}}
  else if(!g.en.length){if(g.autoWave){g.timer-=dt;if(g.timer<=0)startWave()}}
  for(const e of g.en){
    const d=K[e.k];
    if(e.slowT>0)e.slowT-=dt;if(e.stT>0)e.stT-=dt;if(e.mkT>0)e.mkT-=dt;if(e.hurtT>0)e.hurtT-=dt;if(e.kb>0)e.kb=Math.max(0,e.kb-25*dt);
    if(e.bt>0){e.bt-=dt;e.hp-=e.bn*dt}
    if(d.rg&&e.hp>0&&e.hurtT<=0)e.hp=Math.min(e.mx,e.hp+e.mx*d.rg*dt);

  }
  if(tab==='o'){
    h='<div class="opt"><input type="checkbox" id="autoChk" '+(g.autoWave?'checked':'')+' onchange="toggleAuto()"><label for="autoChk">Lancer les vagues automatiquement après un délai</label></div>'+
     '<p style="margin-top:0">Si décoché, aucune vague ne démarre tant que tu n\u2019appuies pas sur « Vague suivante » (ou Espace).</p>'+
     '<div class="row"><button onclick="exportSave()">Exporter la sauvegarde (.txt)</button><button onclick="document.getElementById(&quot;impFile&quot;).click()">Importer une sauvegarde</button></div>'+
     '<input type="file" id="impFile" accept=".txt,.json" style="display:none">'+
     '<div id="impMsg" class="hint"></div>'+
     '<div class="row"><button onclick="resetDex()">Réinitialiser les index (bestiaire / tours)</button></div>';
    $('cards').innerHTML=h;
    $('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;importFile(f,ok=>{$('impMsg').textContent=ok?('Sauvegarde importée.'+lastImportNote):'Fichier invalide ou illisible.';if(ok)renderDex()})};
    return;
  }
  if(tab==='b'){
    const seen=K.map((d,i)=>i).filter(i=>DX.k[i]>0);
    h=seen.length?'':'<p>Aucun Vide vaincu pour l\u2019instant. Les ennemis apparaissent ici après leur première défaite.</p>';
    for(const i of seen){
      const d=K[i],ab=[d.ar&&'armure '+Math.round(d.ar*100)+' %',d.rg&&'régénération',d.ims&&'insensible au gel',d.sp2&&'se divise',d.grp&&'en groupe',d.boss&&'boss'].filter(Boolean).join(', ')||'aucune';
      h+='<div class="card"><canvas id="dc'+i+'" width="96" height="96"></canvas><h3>'+d.n+'</h3><div>Vaincus : <b>'+DX.k[i]+'</b></div><div>'+d.ds+'</div><table>'+
       '<tr><td>PV (vague '+w+')</td><td>'+Math.round(hpAt(i,w))+'</td></tr>'+
       '<tr><td>Vitesse</td><td>'+d.sp+' px/s</td></tr>'+
       '<tr><td>Récompense</td><td>'+Math.round(d.rw*(1+TUNE.rwGrow*(w-1)))+'💰</td></tr>'+
       '<tr><td>Vies perdues</td><td>'+(d.life||1)+'</td></tr>'+
       '<tr><td>Capacités</td><td>'+ab+'</td></tr></table></div>';
      draws.push(c=>{const k=Math.min(2.4,36/d.r);c.scale(k,k);drawEnemy(c,{k:i,x:48/k,y:54/k,r:d.r,slowT:0,stT:0,bt:0,hp:1,mx:1})});
    }
    $('cards').dataset.h='';
  }else{
    const seen=T.map((d,i)=>i).filter(j=>DX.t[j]>0);
    h=seen.length?'':'<p>Aucune tour obtenue pour l\u2019instant. Elles apparaissent ici dès que tu en obtiens une.</p>';
    for(const j of seen){
      const d=T[j],mx=DX.t[j],l=Math.min(vl[j]||1,mx),a=stat(j,l),p=pw(j,l);vl[j]=l;
      let chips='';for(let i=1;i<=mx;i++)chips+='<span class="chip'+(i===l?' cur':'')+'">'+i+'</span>';
      h+='<div class="card"><canvas id="tc'+j+'" width="96" height="96"></canvas><h3 style="color:'+d.c+'">'+d.n+'</h3><div style="color:'+RC[d.rar]+'">'+RN[d.rar]+'</div>'+
       '<div>Niveaux débloqués : '+chips+'</div>'+
       '<div class="row"><button onclick="lvStep('+j+',-1)"'+(l<=1?' disabled':'')+'>◀</button><button onclick="lvStep('+j+',1)"'+(l>=mx?' disabled':'')+'>Niveau '+Math.min(l+1,mx)+' ▶</button></div>'+
       '<table><tr><td>Niveau affiché</td><td>'+l+'</td></tr>'+
       '<tr><td>Fusion minimale</td><td>'+Math.max(1,Math.ceil((l-1)/2))+'</td></tr>'+
       '<tr><td>Dégâts</td><td>'+a.dmg+'</td></tr><tr><td>Rayon d\u2019action</td><td>'+a.range+' px</td></tr>'+
       '<tr><td>Cadence</td><td>'+a.sh+' tirs/s</td></tr><tr><td>Dégâts / seconde</td><td>'+a.dps+'</td></tr></table>'+
       '<b>'+p[0]+'</b> : '+p[1]+'<br><i>'+p[2]+'</i></div>';
      draws.push(c=>{c.scale(1.5,1.5);drawTower(c,32,30,{type:j,fu:Math.max(1,Math.ceil((l-1)/2)),lvl:l,h:0})});
    }
  }
  $('cards').innerHTML=h;
  const ids=tab==='b'?K.map((d,i)=>i).filter(i=>DX.k[i]>0):T.map((d,i)=>i).filter(j=>DX.t[j]>0);
  ids.forEach((id,n)=>{const c=$((tab==='b'?'dc':'tc')+id).getContext('2d');draws[n](c)});
}
reset();g.paused=true;requestAnimationFrame(loop);
</script>
</body>
</html>
