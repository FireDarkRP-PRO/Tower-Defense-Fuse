<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD Fuse – Tower Defense à fusion</title>
<style>
:root{--void:#080a1c;--panel:#12153a;--line:#2b3070;--gold:#ffd84a;--text:#e8ecff}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:var(--void);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px}
#top{display:flex;gap:28px;font-size:19px;font-weight:700;align-items:center}
#top b{color:var(--gold)}
#main{display:flex;gap:10px;align-items:flex-start}
canvas{width:min(100vw - 360px,(100vh - 130px)*16/9);height:auto;aspect-ratio:16/9;border:2px solid var(--line);border-radius:10px;background:#0b0d26;cursor:pointer}
#side{width:320px;display:flex;flex-direction:column;gap:8px;max-height:calc(min(100vw - 360px,(100vh - 130px)*16/9)*9/16 + 4px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#side>*{flex:none}
#xf,#inv{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;font-size:13px;line-height:1.4}
#xf h3,#inv h3{margin:0 0 4px}
.irow{display:grid;grid-template-columns:repeat(5,52px);gap:6px;justify-content:center;margin-top:8px}
.is{width:52px;height:52px;border:2px dashed var(--line);border-radius:8px;cursor:pointer;background:#0b0d26}
.is:hover{border-color:var(--gold)}
.is canvas{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;background:none;cursor:pointer}
.xrow{display:flex;gap:10px;justify-content:center;margin-top:8px}
.xs{width:70px;height:70px;border:2px dashed var(--line);border-radius:8px;cursor:pointer;background:#0b0d26}
.xs:hover{border-color:var(--gold)}
.xs canvas{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;background:none;cursor:pointer}
#sheet{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.45;}
#sheet h2{margin:0;font-size:22px}
table{width:100%;border-collapse:collapse;margin:8px 0}
td{padding:3px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;padding:8px 6px}
.up{color:#7dff9a}
#msg{min-height:20px;font-size:15px;color:#9fb0ff}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
#sp{width:64px;font:inherit;font-weight:700;color:var(--text);background:#0b0d26;border:2px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center}
#sp:focus{outline:none;border-color:var(--gold)}
button{font:inherit;font-weight:700;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:3px solid var(--gold)}
button:disabled{opacity:.45;cursor:default}
button.on{border-color:var(--gold);background:#1d2160}
#dex,#start{position:fixed;inset:0;background:rgba(8,10,28,.93);display:none;align-items:center;justify-content:center;z-index:5}
#dex.on,#start.on{display:flex}
#startbox{width:min(800px,94vw);max-height:94vh;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:20px;text-align:center}
.seg{display:flex;gap:8px;justify-content:center;margin:6px 0}
.seg button{min-width:110px}
#lvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;margin:8px 0}
.lvc{border:2px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;gap:2px;background:#0b0d26;text-align:left}
.lvc:hover{border-color:#6b75d8}.lvc.on{border-color:var(--gold);background:#1d2160}
.lvc canvas{width:100%;height:auto;aspect-ratio:16/9;border:0;border-radius:5px;cursor:pointer}
.lvc span{color:#9fb0ff}
#startbox p{color:#c4cbf5}
.opt{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:15px}
.opt input{width:18px;height:18px}
.hint{color:#9fb0ff;font-size:13px;min-height:18px}
#dexbox{width:min(1040px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:18px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.card{border:2px solid var(--line);border-radius:10px;padding:10px;background:#0b0d26;font-size:14px;line-height:1.5}
.card h3{margin:4px 0 0}
.card canvas{width:96px;height:96px;aspect-ratio:auto;border:0;background:none;cursor:default}
.chip{display:inline-block;min-width:24px;text-align:center;border:1px solid #7dff9a;border-radius:6px;margin:2px;padding:1px 5px;font-size:13px}
.chip.cur{background:#7dff9a;color:#000}
</style>
</head>
<body>
<div id="top"><span>💰 <b id="co"></b></span><span>❤ <b id="li"></b></span><span>Vague <b id="wa"></b></span><span id="lvn" style="color:#9fb0ff;font-size:15px"></span><span id="nx"></span></div>
<div id="main"><canvas id="c" width="1280" height="720"></canvas><div id="side"><aside id="sheet"></aside><div id="xf"></div><div id="inv"></div></div></div>
<div id="msg"></div>
<div id="bar">
  <button id="bb">Météorite (B)</button>
  <button id="bu" style="display:none"></button>
  <button id="bw">Vague suivante (Espace)</button>
  <button id="bn" style="display:none"></button>
  <button id="bv">Vitesse ×1 (V)</button>
  <input id="sp" type="number" min="1" max="100" step="1" value="1" title="Vitesse personnalisée : de ×1 à ×100">
  <button id="bd">Pause · Index (E)</button>
</div>
<div id="dex"><div id="dexbox">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:8px;align-items:center"><b style="font-size:20px">⏸ Pause</b><button id="tr" onclick="setTab('r')">Règles</button><button id="tb" onclick="setTab('b')">Bestiaire</button><button id="tt" onclick="setTab('t')">Tours</button><button id="to" onclick="setTab('o')">Options</button></div>
    <div style="display:flex;gap:8px"><button onclick="closeDex()">Reprendre (Échap)</button></div>
  </div>
  <div id="cards"></div>
</div></div>
<div id="start" class="on"><div id="startbox">
  <h2 style="margin:0 0 6px">TD Fuse by FireDarkRP</h2>
  <p style="margin:4px 0 10px">Choisis une difficulté et un niveau, ou reprends une partie sauvegardée.</p>
  <div class="seg" id="diffBtns"></div><div id="diffDs" class="hint"></div>
  <div id="lvGrid"></div><div id="lvDs" class="hint"></div>
  <div class="row"><button id="startNew">Nouvelle partie</button><button id="startImp">Importer une sauvegarde (.txt)</button><button id="startBack" style="display:none">Retour au jeu</button></div>
  <input type="file" id="startFile" accept=".txt,.json" style="display:none">
  <div id="startMsg" class="hint"></div>
</div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=id=>document.getElementById(id);
// ---------- Réglages d'équilibrage ----------
const TUNE={hp0:22,hpGrow:1.15,dmgGrow:1.35,box0:50,boxStep:6,boxMax:400,up0:20,upGrow:1.5,rwGrow:.04,
  // Après la vague softW (fin de partie) : la résistance des ennemis, leur nombre et leurs récompenses suivent une courbe plus douce,
  // pour que l'argent rentre aussi vite que les ennemis deviennent costauds et que la partie puisse continuer bien au-delà de la vague 40.
  softW:30,hpGrow2:1.06,rwGrow2:1.07,cnt2:1};
const WIN_WAVE=30;
const cap=f=>1+2*f; // limite de niveau selon la fusion : 3, 5, 7, 9, 11… (fusion infinie)
// ---------- Difficultés ----------
const DIFF=[
 {n:'Facile',hp:.75,sp:.9,rw:1.2,coins:180,lives:30,ds:'Ennemis moins résistants et plus lents, plus de vies et de pièces au départ.'},
 {n:'Moyen',hp:1,sp:1,rw:1,coins:120,lives:20,ds:'L\u2019équilibrage de base du jeu.'},
 {n:'Difficile',hp:1.4,sp:1.12,rw:.9,coins:90,lives:12,ds:'Ennemis 40 % plus résistants et plus rapides, peu de vies, récompenses réduites.'}

 {n:'Serpent',ds:'Un long serpent à quatre lignes : beaucoup de temps pour tirer.',

   for(let i=0;i<11;i++)a.push([100+i*100,34]);       // rangée du haut
   for(let i=0;i<9;i++)a.push([200+i*100,170]);       // entre la 1re et la 2e ligne
   for(let i=0;i<9;i++)a.push([290+i*100,330]);       // entre la 2e et la 3e ligne
   for(let i=0;i<7;i++)a.push([380+i*100,495]);       // entre la 3e et la 4e ligne
   for(let i=0;i<7;i++)a.push([450+i*106,668]);       // rangée du bas
   [100,200,330,440,540,668].forEach(y=>a.push([1190,y])); // colonne de droite
   a.push([83,295],[83,395]);                         // côté gauche
   return a})()},
 {n:'Spirale',ds:'La route s\u2019enroule autour du plateau jusqu\u2019au portail, au centre.',
  routes:[[[-40,60],[1220,60],[1220,660],[60,660],[60,210],[1070,210],[1070,510],[210,510],[210,360],[640,360]]],
  slots:(()=>{const a=[];
   // emplacements espacés, placés selon le plan dessiné
   for(let i=0;i<11;i++)a.push([70+i*105,137]);       // rangée du haut (anneau extérieur)
   [227,316,406,496].forEach(y=>a.push([1145,y]));    // colonne de droite
   for(let i=0;i<11;i++)a.push([135+i*101,585]);      // rangée du bas

   for(let i=0;i<4;i++)a.push([285+i*100,440]);       // intérieur : sous la route du centre

   return a})()},
 {n:'Croisement',ds:'La route se recoupe elle-même : les ennemis passent deux fois au centre.',
  routes:[[[-40,360],[1000,360],[1000,120],[640,120],[640,620],[1200,620]]],
  slots:(()=>{const a=[];
   // emplacements espacés, placés selon le plan dessiné
   for(let i=0;i<6;i++)a.push([555+i*104,35]);        // rangée du haut
   [135,235,335].forEach(y=>a.push([1075,y]));        // colonne de droite
   a.push([555,156]);                                 // colonne au-dessus de la route de gauche

   for(let i=0;i<3;i++)a.push([725+i*95,240]);        // intérieur de la boucle
   for(let i=0;i<6;i++)a.push([75+i*96,440]);         // sous la route de gauche
   [540,640].forEach(y=>a.push([555,y]));             // colonne sous le croisement
   for(let i=0;i<4;i++){a.push([715+i*100,440]);a.push([715+i*100,540])} // zone en bas à droite
   for(let i=0;i<4;i++)a.push([730+i*100,684]);       // rangée sous la route du portail
   return a})()},
 {n:'Demi-tour',ds:'La route repasse sur son premier tronçon à l\u2019envers, puis part vers le bas.',
  routes:[[[-40,360],[900,360],[900,150],[1180,150],[1180,360],[300,360],[300,600],[1000,600]]],
  slots:(()=>{const a=[];
   // emplacements espacés, placés selon le plan dessiné

   a.push([975,255],[1100,255]);                      // intérieur de la boucle

   a.push([85,437],[200,437],[200,537]);              // en bas à gauche (forme en 7)
   for(let i=0;i<8;i++)a.push([412+i*103.3,470]);     // rangée du milieu, sous la route
   for(let i=0;i<5;i++)a.push([425+i*105,675]);       // rangée du bas
   return a.map(p=>[Math.round(p[0]),p[1]])})()},
 {n:'Fourche',ds:'Deux entrées (haut et bas) qui fusionnent sur une seule route vers le portail.',
  routes:[[[-40,130],[480,130],[480,360],[1000,360],[1000,560],[1200,560]],[[-40,590],[480,590],[480,360],[1000,360],[1000,560],[1200,560]]],

   a.push([1078,415]);                                // à droite de la route du portail
   for(let i=0;i<4;i++){a.push([75+i*110,215]);a.push([75+i*110,496])} // rangées de la zone de gauche
   a.push([405,309],[405,402]);                       // côté droit de la zone de gauche
   for(let i=0;i<6;i++)a.push([68+i*96,670]);         // rangée du bas
   a.push([548,555]);                                 // colonne qui remonte
   for(let i=0;i<5;i++)a.push([548+i*95.5,440]);      // rangée sous la route du milieu
   a.push([930,535],[930,630],[1050,640]);            // côté du portail
   return a.map(p=>[Math.round(p[0]),p[1]])})()},
 {n:'Îlot',ds:'La route se sépare en deux autour d\u2019un îlot, puis se rejoint avant le portail.',
  routes:[[[-40,360],[300,360],[300,160],[900,160],[900,360],[1200,360]],[[-40,360],[300,360],[300,560],[900,560],[900,360],[1200,360]]],
  slots:(()=>{const a=[];
   // emplacements espacés, placés selon le plan dessiné
   for(let i=0;i<6;i++)a.push([320+i*105,80]);        // rangée du haut
   for(let i=0;i<5;i++)a.push([370+i*115,648]);       // rangée du bas
   for(let i=0;i<5;i++){a.push([404+i*102.75,242]);a.push([404+i*102.75,484])} // rectangle central : haut et bas
   a.push([404,363],[815,363]);                       // rectangle central : côtés
   a.push([60,282],[160,282],[215,185]);              // à gauche, au-dessus de l\u2019entrée
   a.push([60,438],[160,438],[215,535]);              // à gauche, sous l\u2019entrée
   a.push([985,282],[1085,282],[985,185]);            // à droite, au-dessus de la sortie
   a.push([985,438],[1085,438],[985,535]);            // à droite, sous la sortie
   return a.map(p=>[Math.round(p[0]),p[1]])})()},
 {n:'Labyrinthe',ds:'Cinq longs couloirs verticaux, entrée par le haut.',
  routes:[[[200,-40],[200,640],[440,640],[440,80],[680,80],[680,640],[920,640],[920,80],[1160,80],[1160,600]]],
  slots:(()=>{const a=[];
   // emplacements espacés, une colonne dans chaque couloir (plus une de chaque côté), selon le plan dessiné
   for(let i=0;i<6;i++)a.push([120,40+i*105]);        // colonne tout à gauche
   for(let i=0;i<6;i++)a.push([320,40+i*106]);        // couloir 1
   for(let i=0;i<6;i++)a.push([553,166+i*103.6]);     // couloir 2
   for(let i=0;i<6;i++)a.push([795,40+i*98.4]);       // couloir 3
   for(let i=0;i<6;i++)a.push([1040,180+i*95]);       // couloir 4
   for(let i=0;i<5;i++)a.push([1235,86+i*91.25]);     // colonne tout à droite
   return a.map(p=>[Math.round(p[0]),Math.round(p[1])])})()},
 {n:'Entrelacs',ds:'Un entrelacs qui se croise trois fois : les tours centrales travaillent beaucoup.',
  routes:[[[-40,240],[1000,240],[1000,480],[280,480],[280,120],[640,120],[640,600],[1200,600]]],

   [370,460,550].forEach(x=>{a.push([x,317]);a.push([x,408])}); // cellule centrale gauche

   [100,215].forEach(y=>a.push([80,y]));              // à gauche, en haut

   return a.map(p=>[Math.round(p[0]),Math.round(p[1])])})()},
 // ----- Maps à croisements : l'Aiguilleur légendaire peut s'y poser (emplacements dessinés à la main) -----
 {n:'Delta',ds:'Un seul croisement ouvre trois voies : droit, par le haut ou par le bas. L\u2019Aiguilleur choisit où vont les ennemis.',

  slots:[[209,39],[297,39],[385,39],[474,39],[562,39],[650,39],[739,39],[827,39],[915,39],[130,105],[1066,164],[130,200],[919,240],[642,241],[734,241],[826,241],[364,242],[457,242],[549,242],[272,243],[1066,259],[42,291],[136,291],[69,421],[1060,452],[896,482],[627,483],[717,483],[806,483],[359,484],[448,484],[538,484],[269,485],[127,501],[1068,546],[127,587],[254,671],[341,671],[427,671],[514,671],[601,671],[687,671],[774,671],[860,671],[947,671]],
  routes:[
   [[-40,360],[200,360],[200,110],[1000,110],[1000,360],[1200,360]],
   [[-40,360],[200,360],[1000,360],[1200,360]],
   [[-40,360],[200,360],[200,610],[1000,610],[1000,360],[1200,360]]]},
 {n:'Carrefour',ds:'Deux entrées (gauche et haut) se croisent au centre, puis repartent vers la droite ou vers le bas.',
  // emplacements espacés, placés selon le plan dessiné (traits rouges)
  slots:[[550,39],[699,39],[550,119],[700,121],[550,199],[700,203],[60,279],[141,279],[223,279],[305,279],[386,279],[468,279],[550,279],[701,285],[799,286],[893,287],[988,288],[1061,386],[898,439],[570,440],[327,441],[408,441],[489,441],[803,441],[164,442],[245,442],[83,443],[708,443],[1070,466],[568,526],[1078,545],[741,552],[821,552],[900,552],[565,612],[688,681],[783,681],[878,681],[972,681],[1067,681]],

  if(k==='b')$('bb').onclick();else if(k==='f'&&g.tier>=2)$('bu').onclick();else if(k==='u')upgrade();else if(k==='s')sell();else if(k==='n')nuke();else if(k==='t')rotGT();
  else if(k==='v')$('bv').onclick();
  else if(k==='r')reset();
  else if(k===' '){ev.preventDefault();$('bw').onclick()}
});
// ---------- Menu pause : bestiaire et tours ----------
function setTab(t){tab=t;renderDex()}
function toggleInvFirst(){SET.invFirst=!SET.invFirst;save();renderDex()}
function toggleAuto(){g.autoWave=!g.autoWave;SET.autoWave=g.autoWave;save();renderDex()}
function openDex(t){g.paused=true;save();if(t)tab=t;$('dex').classList.add('on');renderDex()}
function closeDex(){g.paused=false;$('dex').classList.remove('on')}
function resetDex(){if(confirm('Effacer les tours et ennemis découverts ?')){DX={k:K.map(()=>0),t:T.map(()=>0)};save();renderDex()}}
function lvStep(j,n){vl[j]=Math.max(1,Math.min(DX.t[j],(vl[j]||1)+n));renderDex()}
function renderDex(){
  $('tr').classList.toggle('on',tab==='r');$('tb').classList.toggle('on',tab==='b');$('tt').classList.toggle('on',tab==='t');$('to').classList.toggle('on',tab==='o');
  const w=Math.max(1,g.wave);let h='';const draws=[];
  if(tab==='r'){
    $('cards').innerHTML='<div style="grid-column:1/-1;max-width:720px;line-height:1.6">'+
     '<h3>But du jeu</h3><p>Empêche les Vides d\u2019atteindre le portail doré. Chaque ennemi qui passe te coûte des vies (davantage pour les boss) ; à 0 vie, la partie est terminée.</p>'+
     '<h3>Météorites</h3><p>Achète une météorite avec tes pièces pour obtenir une tour aléatoire sur un emplacement libre, ou dans l\u2019inventaire s\u2019il n\u2019y en a plus (prix croissant). Sa rareté détermine ses chances d\u2019apparition : Commun et Peu commun sont fréquents, Rare l\u2019est moins, Épique et Légendaire sont exceptionnelles.</p>'+
     '<h3>Améliorer</h3><p>Clique sur une tour posée pour afficher sa fiche à droite : dégâts, rayon d\u2019action, cadence et pouvoir spécial. Le bouton Améliorer augmente son niveau contre des pièces, jusqu\u2019à une limite.</p>'+
     '<h3>Fusionner</h3><p>Glisse une tour sur une autre tour identique (même type, même fusion) pour les fusionner. Cela consomme les deux tours et en donne une seule : fusion +1 et une limite de niveau plus haute (le niveau est conservé ; +1 seulement si les deux tours sont au niveau max, jamais en Difficile). Il n\u2019y a pas de limite de fusion.</p>'+
     '<h3>Transformation</h3><p>Dans le panneau Transformation, place 3 tours de fusion 2 : elles sont consommées et débloquent un bouton de météorites de fusion 2 (touche B). Le bouton d\u2019origine passe à moitié prix (la revente des tours de ce niveau aussi). Avec 3 tours de fusion 3, tu débloques la fusion 3, et le bouton à moitié prix devient la fusion 2, et ainsi de suite à l\u2019infini.</p>'+
     '<h3>Inventaire</h3><p>L\u2019inventaire a 10 places, partagées entre les tours normales et l\u2019Aiguilleur. Une nouvelle tour y arrive quand il n\u2019y a plus de place pour elle sur le plateau (plus d\u2019emplacement libre, ou plus de croisement libre pour l\u2019Aiguilleur), ou dès qu\u2019il reste une place si l\u2019option « Les nouvelles tours arrivent d\u2019abord dans l\u2019inventaire » est cochée dans les paramètres. La météorite s\u2019y ouvre comme sur le plateau. Les tours rangées sont inactives : clique dessus pour les poser sur le plateau, glisse-les sur une tour identique pour fusionner, ou clic droit pour les vendre. Tu peux aussi y ranger une tour du plateau en la glissant dessus.</p><h3>Vitesse</h3><p>Le bouton Vitesse (touche V) alterne entre ×1, ×2, ×3 et ×4. À côté du bouton, le champ numérique te laisse choisir la vitesse que tu veux, de ×1 à ×100. Si ton appareil n\u2019arrive pas à suivre, le jeu va moins vite que demandé plutôt que de se figer. La vitesse revient à ×1 à chaque nouvelle partie.</p>'+
     '<h3>Tour mythique</h3><p>Chaque météorite a 0,1 % de chances de contenir le Néant. Il ne tire pas : il ajoute un bouton Nuke (touche N) qui retire une part des PV max de tous les ennemis à l\u2019écran, de 20 % au niveau 1 jusqu\u2019à 100 % au niveau max (niveau 9, fusion 4) ; les boss subissent moitié moins. Utilisable une fois toutes les 3 vagues. Comme les autres tours, il se fusionne avec un Néant identique pour monter sa limite de niveau.</p>'+
     '<h3>Tour légendaire : l\u2019Aiguilleur</h3><p>Il ne tire pas. Sur les maps à croisements (Îlot, Delta, Carrefour, Double fourche, Échangeur), la météorite peut le poser automatiquement sur un croisement libre. Sa flèche indique la branche vers laquelle il attire une part des ennemis qui passent (15 % au niveau 1, jusqu\u2019à 95 %). Clique sur la tour (ou touche T) pour la tourner ; glisse-la vers un autre croisement pour la déplacer. Chaque ennemi n\u2019est attiré qu\u2019une fois par croisement.</p>'+
     '<h3>Vagues</h3><p>Les vagues arrivent les unes après les autres ; un boss apparaît toutes les 5 vagues. Jusqu\u2019à la vague 30 la difficulté monte vite ; ensuite elle grimpe plus doucement et les récompenses suivent, pour que tu puisses continuer très loin. Dans les Options, tu peux choisir si la vague suivante démarre automatiquement après un délai, ou seulement quand tu appuies sur « Vague suivante » (ou Espace).</p>'+
     '<h3>Sauvegarde</h3><p>Ta partie en cours est sauvegardée automatiquement dans le navigateur : rafraîchir la page ne la supprime pas. Tu peux aussi l\u2019exporter dans un fichier .txt depuis les Options, et la réimporter plus tard ou sur un autre ordinateur.</p>'+
     '<h3>Niveaux et difficultés</h3><p>Quatorze niveaux aux routes différentes : certaines se croisent, repassent sur un tronçon déjà emprunté ou se séparent puis se rejoignent. Trois difficultés (Facile, Moyen, Difficile) modifient la résistance et la vitesse des ennemis, les vies, les pièces de départ et les récompenses. Tu peux changer de niveau depuis les Options (nouvelle partie).</p>'+
     '<h3>Index</h3><p>Le Bestiaire répertorie les Vides déjà vaincus, avec leurs statistiques. L\u2019onglet Tours répertorie les tours déjà obtenues, avec leurs statistiques à chaque niveau débloqué.</p>'+
     '</div>';
    return;
  }
  if(tab==='o'){
    h='<div class="opt"><input type="checkbox" id="autoChk" '+(g.autoWave?'checked':'')+' onchange="toggleAuto()"><label for="autoChk">Lancer les vagues automatiquement après un délai</label></div>'+
     '<p style="margin-top:0">Si décoché, aucune vague ne démarre tant que tu n\u2019appuies pas sur « Vague suivante » (ou Espace).</p>'+
     '<div class="opt"><input type="checkbox" id="invChk" '+(SET.invFirst?'checked':'')+' onchange="toggleInvFirst()"><label for="invChk">Les nouvelles tours arrivent d\u2019abord dans l\u2019inventaire</label></div>'+
     '<p style="margin-top:0">Si coché, une météorite achetée tombe dans l\u2019inventaire tant qu\u2019il reste une place, puis sur le plateau. Si décoché, elle tombe sur le plateau, puis dans l\u2019inventaire quand il n\u2019y a plus de place pour elle.</p>'+
     '<div class="row"><button onclick="exportSave()">Exporter la sauvegarde (.txt)</button><button onclick="document.getElementById(&quot;impFile&quot;).click()">Importer une sauvegarde</button></div>'+
     '<input type="file" id="impFile" accept=".txt,.json" style="display:none">'+
     '<div id="impMsg" class="hint"></div>'+
     '<div class="row"><button onclick="resetDex()">Réinitialiser les index (bestiaire / tours)</button></div>'+
     '<div class="row"><button onclick="openStart()">Changer de niveau / de difficulté (nouvelle partie)</button></div>';
    $('cards').innerHTML=h;
    $('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;importFile(f,ok=>{$('impMsg').textContent=ok?('Sauvegarde importée.'+lastImportNote):'Fichier invalide ou illisible.';if(ok)renderDex()})};
    return;
  }
  if(tab==='b'){
    const seen=K.map((d,i)=>i).filter(i=>DX.k[i]>0);
    h=seen.length?'':'<p>Aucun Vide vaincu pour l\u2019instant. Les ennemis apparaissent ici après leur première défaite.</p>';
    for(const i of seen){
      const d=K[i],ab=[d.ar&&'armure '+Math.round(d.ar*100)+' %',d.rg&&'régénération',d.ims&&'insensible au gel',d.sp2&&'se divise',d.grp&&'en groupe',d.boss&&'boss'].filter(Boolean).join(', ')||'aucune';
      h+='<div class="card"><canvas id="dc'+i+'" width="96" height="96"></canvas><h3>'+d.n+'</h3><div>Vaincus : <b>'+DX.k[i]+'</b></div><div>'+d.ds+'</div><table>'+
       '<tr><td>PV (vague '+w+')</td><td>'+Math.round(hpAt(i,w))+'</td></tr>'+
       '<tr><td>Vitesse</td><td>'+Math.round(d.sp*DIFF[g.diff].sp)+' px/s</td></tr>'+
       '<tr><td>Récompense</td><td>'+rwAt(i,w)+'💰</td></tr>'+
       '<tr><td>Vies perdues</td><td>'+(d.life||1)+'</td></tr>'+
       '<tr><td>Capacités</td><td>'+ab+'</td></tr></table></div>';
      draws.push(c=>{const k=Math.min(2.4,36/d.r);c.scale(k,k);drawEnemy(c,{k:i,x:48/k,y:54/k,r:d.r,slowT:0,stT:0,bt:0,hp:1,mx:1})});
    }
    $('cards').dataset.h='';
  }else{
    const seen=T.map((d,i)=>i).filter(j=>DX.t[j]>0);
    h=seen.length?'':'<p>Aucune tour obtenue pour l\u2019instant. Elles apparaissent ici dès que tu en obtiens une.</p>';
    for(const j of seen){
      const d=T[j],mx=DX.t[j],l=Math.min(vl[j]||1,mx),a=stat(j,l),p=pw(j,l);vl[j]=l;
      let chips='';for(let i=1;i<=mx;i++)chips+='<span class="chip'+(i===l?' cur':'')+'">'+i+'</span>';
      h+='<div class="card"><canvas id="tc'+j+'" width="96" height="96"></canvas><h3 style="color:'+d.c+'">'+d.n+'</h3><div style="color:'+RC[d.rar]+'">'+RN[d.rar]+'</div>'+
       '<div>Niveaux débloqués : '+chips+'</div>'+
       '<div class="row"><button onclick="lvStep('+j+',-1)"'+(l<=1?' disabled':'')+'>◀</button><button onclick="lvStep('+j+',1)"'+(l>=mx?' disabled':'')+'>Niveau '+Math.min(l+1,mx)+' ▶</button></div>'+
       '<table><tr><td>Niveau affiché</td><td>'+l+'</td></tr>'+
       '<tr><td>Fusion minimale</td><td>'+Math.max(1,Math.ceil((l-1)/2))+'</td></tr>'+(j===GT?'<tr><td>Ennemis attirés</td><td>'+a.pc+' %</td></tr>':'')+(j===MY?'<tr><td>PV max retirés (ennemis)</td><td>'+a.nk+' %</td></tr><tr><td>PV max retirés (boss)</td><td>'+a.nb+' %</td></tr><tr><td>Recharge</td><td>'+a.cdw+' vagues</td></tr>':'')+
       (j===MY||j===GT?'':'<tr><td>Dégâts</td><td>'+a.dmg+'</td></tr><tr><td>Rayon d\u2019action</td><td>'+a.range+' px</td></tr>')+
       (j===MY||j===GT?'':'<tr><td>Cadence</td><td>'+a.sh+' tirs/s</td></tr><tr><td>Dégâts / seconde</td><td>'+a.dps+'</td></tr>')+'</table>'+
       '<b>'+p[0]+'</b> : '+p[1]+'<br><i>'+p[2]+'</i></div>';
      draws.push(c=>{c.scale(1.5,1.5);drawTower(c,32,30,{type:j,fu:Math.max(1,Math.ceil((l-1)/2)),lvl:l,h:0})});
    }
  }
  $('cards').innerHTML=h;
  const ids=tab==='b'?K.map((d,i)=>i).filter(i=>DX.k[i]>0):T.map((d,i)=>i).filter(j=>DX.t[j]>0);
  ids.forEach((id,n)=>{const c=$((tab==='b'?'dc':'tc')+id).getContext('2d');draws[n](c)});
}
// ---------- Sauvegarde automatique de la partie en cours (survit au rafraîchissement) ----------
const GAME_KEY='cst-game';
function snapshot(){
  return{v:1,lv:g.lv,diff:g.diff,coins:g.coins,lives:g.lives,wave:g.wave,boxes:g.boxes,tier:g.tier,autoWave:g.autoWave,
    nk:g.nk,cont:g.cont,won:g.won,timer:g.timer,cd:g.cd,rc:g.rc,q:g.q,en:g.en.filter(e=>e.hp>0&&!e.dead&&!e.esc),
    slots:S.map(s=>towerData(s.t)),xf:g.xf.map(towerData),inv:g.inv.map(towerData)};
}
// État de la partie tel qu'il est enregistré (null quand il n'y a pas de partie à reprendre : partie perdue)
function gameState(){return g.over?null:snapshot()}
function persistGame(){
  try{
    const st=gameState();
    if(st)localStorage.setItem(GAME_KEY,JSON.stringify(st));else localStorage.removeItem(GAME_KEY);
  }catch(e){}
}
function autosave(){
  if($('start').classList.contains('on'))return;
  persistGame();
}
function restoreGame(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.slots))return false;
  SET.lv=LV[d.lv]?d.lv|0:0;SET.diff=DIFF[d.diff]?d.diff|0:1;
  reset();selLv=SET.lv;selDf=SET.diff;
  g.coins=+d.coins||0;g.lives=d.lives>0?+d.lives:DIFF[g.diff].lives;g.wave=Math.max(0,d.wave|0);g.boxes=Math.max(0,d.boxes|0);
  g.tier=Math.max(1,d.tier|0);g.xf=[0,1,2].map(i=>mkT(d.xf&&d.xf[i]));
  g.inv=Array.from({length:INV_N},(_,i)=>mkT(d.inv&&d.inv[i]));
  g.autoWave=d.autoWave!==false;SET.autoWave=g.autoWave;
  g.nk=Number.isFinite(d.nk)?d.nk:-99;g.cont=!!d.cont;g.won=!!d.won;
  g.timer=Number.isFinite(d.timer)?d.timer:12;g.cd=+d.cd||0;g.rc=d.rc|0;
  g.q=(Array.isArray(d.q)?d.q:[]).filter(k=>K[k]);
  g.en=(Array.isArray(d.en)?d.en:[]).filter(e=>e&&K[e.k]&&RT[e.rt]&&e.hp>0&&e.mx>0);
  fillSlots(d.slots,false);
  g.paused=g.won;
  return true;
}
addEventListener('beforeunload',autosave);addEventListener('pagehide',autosave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave()});
setInterval(autosave,1500);
selLv=LV[SET.lv]?SET.lv:0;selDf=DIFF[SET.diff]?SET.diff:1;
reset();g.paused=true;renderStart();
{let sv=null;try{sv=JSON.parse(localStorage.getItem(GAME_KEY))}catch(e){}
 let ok=false;try{ok=restoreGame(sv)}catch(e){ok=false}
 if(ok){closeStart();g.paused=g.won;say('Partie reprise là où tu l\u2019avais laissée.')}else if(sv){reset();g.paused=true;renderStart()}}
requestAnimationFrame(loop);
</script>
